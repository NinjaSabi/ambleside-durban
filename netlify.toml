[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Legacy URLs still ranked by Google but returning 404 (Search Console, Oct 2026)
[[redirects]]
  from = "/employment"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/employment/*"
  to = "/contact/"
  status = 301

[[redirects]]
  from = "/curriculum"
  to = "/primary-school/curriculum/"
  status = 301

[[redirects]]
  from = "/curriculum/*"
  to = "/primary-school/curriculum/"
  status = 301

[[redirects]]
  from = "/about-us"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/about-us/*"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/ambleside-schools"
  to = "/about/charlotte-mason/"
  status = 301

[[redirects]]
  from = "/ambleside-schools/*"
  to = "/about/charlotte-mason/"
  status = 301

[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Deliberately NOT immutable. Netlify applies these headers to 404 responses
# too, and CMS images 404 for the minute it takes a deploy to land. An immutable
# 404 is cached by the publisher's browser for a year and never revalidated, so
# the person who uploaded the image is the one person who cannot see it.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
